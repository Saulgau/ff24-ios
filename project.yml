# FilmFrei24 für iPhone/iPad (iOS) und Apple TV (tvOS) – ein gemeinsamer SwiftUI-Code.
# Projekt erzeugen (auf dem Mac):  brew install xcodegen && xcodegen generate  → FilmFrei24.xcodeproj
name: FilmFrei24
options:
  bundleIdPrefix: com.filmfrei24
  deploymentTarget:
    iOS: "16.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    MARKETING_VERSION: "2.9.0"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # eigenes Apple-Team eintragen
    CODE_SIGN_STYLE: Automatic

targets:
  FilmFrei24:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/iOS.xcassets
      - path: Resources/de.lproj
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: FilmFrei24
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        UILaunchScreen:
          UIColorName: LaunchBg
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Inter-ExtraBold.ttf, Inter-Black.ttf]
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.filmfrei24.app.login
            CFBundleURLSchemes: [filmfrei24]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filmfrei24.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FilmFrei24TV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/tvOS.xcassets
      - path: Resources/de.lproj
    info:
      path: Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: FilmFrei24
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Inter-ExtraBold.ttf, Inter-Black.ttf]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBg
        CFBundleURLTypes:
          - CFBundleURLName: com.filmfrei24.tv.open
            CFBundleURLSchemes: [filmfrei24]
    dependencies:
      - target: FilmFrei24TopShelf
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filmfrei24.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # Startbildschirm-Banner (Top Shelf): Top 10 als 16:9-Bilder mit Direktlinks
  FilmFrei24TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
    info:
      path: Resources/Info-TopShelf.plist
      properties:
        CFBundleDisplayName: FilmFrei24
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filmfrei24.tv.topshelf
        TARGETED_DEVICE_FAMILY: "3"
