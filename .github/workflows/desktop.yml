name: PC-App bauen (Windows + Linux)
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: FilmFrei24-Windows, path: desktop/dist/FilmFrei24-Setup.exe }
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with: { name: FilmFrei24-Linux, path: desktop/dist/FilmFrei24-Setup.AppImage }
