name: Bildschirmfotos (Simulator)
on:
  workflow_dispatch:
    inputs:
      only:
        description: "tv | ios | alle"
        default: "alle"
jobs:
  screens:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Apple TV (Simulator) bauen
        if: inputs.only != 'ios'
        run: xcodebuild -project FilmFrei24.xcodeproj -scheme FilmFrei24TV -sdk appletvsimulator -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" ; test ${PIPESTATUS[0]} -eq 0
      - name: iPhone/iPad (Simulator) bauen
        if: inputs.only != 'tv'
        run: xcodebuild -project FilmFrei24.xcodeproj -scheme FilmFrei24 -sdk iphonesimulator -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" ; test ${PIPESTATUS[0]} -eq 0
      - name: Fotos
        run: tools/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots/
