name: IPA bauen (unsigniert)
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Projekt erzeugen
        run: brew install xcodegen && xcodegen generate
      - name: iOS bauen
        run: |
          xcodebuild -project FilmFrei24.xcodeproj -scheme FilmFrei24 -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build-ios.log | grep -E 'error:|warning: unre|BUILD' ; test ${PIPESTATUS[0]} -eq 0
          mkdir -p out/Payload && cp -r build/Build/Products/Release-iphoneos/FilmFrei24.app out/Payload/
          (cd out && zip -qr FilmFrei24-iOS.ipa Payload && rm -rf Payload)
      - name: tvOS bauen
        continue-on-error: true
        run: |
          xcodebuild -project FilmFrei24.xcodeproj -scheme FilmFrei24TV -sdk appletvos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p out/Payload && cp -r build/Build/Products/Release-appletvos/FilmFrei24TV.app out/Payload/
          (cd out && zip -qr FilmFrei24-AppleTV.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilmFrei24-IPAs
          path: |
            out/*.ipa
            build-ios.log
          if-no-files-found: ignore
