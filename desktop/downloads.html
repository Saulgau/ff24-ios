<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FilmFrei24 – Downloads</title>
<!-- 2026-10-22: Downloads der PC-App, funktioniert auch ganz ohne Internet (Design wie filmfrei24.com) -->
<style>
:root{--bg:#00050d;--box:#14191f;--btn:#33373d;--t2:#aeb3b8;--blue:#1a98ff;--red:#e5484d}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:#fff;font:16px Inter,"Segoe UI",system-ui,sans-serif;min-height:100%}
::-webkit-scrollbar{width:0;height:0}
header{display:flex;align-items:center;gap:22px;padding:22px 48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;cursor:pointer}
.brand svg{width:28px;height:28px}
header a{color:#fff;text-decoration:none;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer}
header a:hover{background:rgba(255,255,255,.12)}header a.on{background:rgba(255,255,255,.18)}
main{padding:10px 48px 80px;max-width:1300px}
h1{font-size:30px;font-weight:800;margin-bottom:6px}
.sum{color:var(--t2);font-size:14px;margin-bottom:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sum button,.btn{background:var(--btn);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.sum button:hover,.btn:hover{background:#464b52}
.btn.w{background:#fff;color:#0b0f15}.btn.w:hover{background:#dfe3e7}
.offline{background:#2a1d00;border:1px solid #7a5600;color:#ffd27a;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.card{display:flex;gap:14px;align-items:center;background:var(--box);border-radius:10px;padding:10px;cursor:pointer;border:1px solid rgba(255,255,255,.05)}
.card:hover{background:#1b222a}
.th{position:relative;flex:none;width:72px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:#141a21}
.th.w{width:150px;aspect-ratio:16/9}
.th img{width:100%;height:100%;object-fit:cover}
.th .p{position:absolute;inset:0;display:grid;place-items:center}
.th .p span{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center}
.info{flex:1;min-width:0}
.info b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{display:block;color:var(--t2);font-size:14px;margin-top:4px}
.st{color:var(--blue);font-size:13px;font-weight:600;margin-top:6px}.st.f{color:var(--red)}
.bar{height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.del{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#dfe3e7;cursor:pointer;display:grid;place-items:center}
.del:hover{background:rgba(255,255,255,.12)}
.empty{text-align:center;padding:90px 20px}
.empty h2{font-size:24px;margin-bottom:10px}.empty p{color:var(--t2);font-size:17px;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px}
#pl{position:fixed;inset:0;background:#000;display:none;z-index:9}
#pl.on{display:block}
#pl video{width:100%;height:100%;background:#000}
#pl .top{position:absolute;left:0;right:0;top:0;padding:18px 24px;display:flex;gap:16px;align-items:center;background:linear-gradient(#000c,#0000);transition:opacity .3s}
#pl.idle .top{opacity:0}
#pl .top button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(51,55,61,.85);color:#fff;cursor:pointer;font-size:20px}
#pl .top b{font-size:18px}#pl .top small{color:var(--t2);display:block}
#next,#skip{position:absolute;right:28px;bottom:110px;display:none;background:#fff;color:#0b0f15;border:0;border-radius:8px;padding:12px 20px;font:700 16px inherit;font-family:inherit;cursor:pointer}
video::cue{background:rgba(0,0,0,.6);font-size:1.4em}
</style>
</head>
<body>
<header>
  <div class="brand" id="home"><svg viewBox="0 0 28 28" fill="none"><rect x="2" y="5" width="24" height="18" rx="3" fill="url(#g)"/><polygon points="11,10 11,18 19,14" fill="#fff"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs></svg>FilmFrei24</div>
  <a id="h2">Startseite</a><a class="on">Downloads</a>
</header>
<main id="m"></main>
<div id="pl"><video id="v" controls autoplay></video>
  <div class="top"><button id="x" title="Schließen">✕</button><div><b id="pt"></b><small id="ps"></small></div></div>
  <button id="skip">Intro überspringen</button><button id="next"></button>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size = b => b >= 1073741824 ? (b / 1073741824).toFixed(1).replace('.', ',') + ' GB' : b >= 1048576 ? Math.round(b / 1048576) + ' MB' : Math.round(b / 1024) + ' KB';
const offline = new URLSearchParams(location.search).has('offline');
const PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.2 4.1A.8.8 0 0 0 7 4.8Z"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.5h5V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg>';
let L = [], series = null;
$('#home').onclick = $('#h2').onclick = () => ff24desk.home();

function status(d) {
  if (d.state === 'done') return '';
  const p = d.bytes ? Math.floor(d.done * 100 / d.bytes) : 0;
  if (d.state === 'failed') return '<div class="st f">Fehlgeschlagen – auf der Detailseite erneut herunterladen</div>';
  if (d.state === 'paused') return '<div class="st">Unterbrochen · ' + p + ' %</div><div class="bar"><i style="width:' + p + '%"></i></div>';
  return '<div class="st">' + (d.state === 'queued' ? 'In Warteschlange' : 'Wird heruntergeladen · ' + p + ' %') + '</div><div class="bar"><i style="width:' + Math.max(1, p) + '%"></i></div>';
}
function card(d, title, sub, wide, grp) {
  return '<div class="card" data-k="' + esc(grp ? '' : d.key) + '"' + (grp ? ' data-s="' + esc(d.id) + '"' : '') + '><div class="th' + (wide ? ' w' : '') + '"><img src="' + esc(d.poster) + '" onerror="this.remove()">'
    + (!grp && d.state === 'done' ? '<div class="p"><span>' + PLAY + '</span></div>' : '') + '</div>'
    + '<div class="info"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small>' + (grp ? '' : status(d)) + '</div>'
    + (grp ? '<span style="font-size:22px;padding:0 10px">›</span>' : '<button class="del" data-del="' + esc(d.key) + '" title="Löschen">' + TRASH + '</button>') + '</div>';
}
function draw() {
  const used = L.reduce((a, d) => a + (d.state === 'done' ? d.bytes : d.done || 0), 0);
  let h = (offline ? '<div class="offline">Keine Internetverbindung – hier sind deine heruntergeladenen Videos. <button class="btn" id="retry" style="margin-left:10px">Erneut verbinden</button></div>' : '');
  if (series) {
    const eps = L.filter(d => d.type === 's' && d.id === series).sort((a, b) => (a.season - b.season) || (a.ep - b.ep));
    if (!eps.length) { series = null; return draw(); }
    h += '<button class="btn back" id="bk">‹ Alle Downloads</button><h1>' + esc(eps[0].title) + '</h1><div class="sum">' + eps.length + ' Folgen</div><div class="grid">'
      + eps.map(d => card(d, d.sub.split(' · ').slice(1).join(' · ') || d.sub, (d.sub.split(' · ')[0] || '') + (d.bytes ? ' · ' + size(d.bytes) : ''), true, false)).join('') + '</div>';
  } else if (!L.length) {
    h += '<h1>Downloads</h1><div class="empty"><h2>Keine Videos heruntergeladen</h2><p>Öffne einen Film oder eine Serie und klicke auf das Download-Symbol –<br>dann kannst du ihn auch ohne Internet ansehen.</p><button class="btn w" id="disc">Videos entdecken</button></div>';
  } else {
    const groups = new Map();
    [...L].sort((a, b) => b.added - a.added).forEach(d => { const k = d.type === 's' ? 's:' + d.id : 'f:' + d.key; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
    h += '<h1>Downloads</h1><div class="sum">' + L.length + ' ' + (L.length === 1 ? 'Video' : 'Videos') + ' · ' + size(used) + ' belegt <button id="fold">Ordner öffnen</button></div><div class="grid">'
      + [...groups.values()].map(g => {
        const d = g[0];
        if (d.type !== 's') return card(d, d.title, d.sub + (d.bytes ? ' · ' + size(d.bytes) : ''), false, false);
        const run = g.filter(x => x.state !== 'done' && x.state !== 'failed').length;
        return card(d, d.title, g.length + ' ' + (g.length === 1 ? 'Folge' : 'Folgen') + ' · ' + size(g.reduce((a, x) => a + (x.bytes || 0), 0)) + (run ? ' · ' + run + ' lädt' : ''), false, true);
      }).join('') + '</div>';
  }
  $('#m').innerHTML = h;
  $('#retry') && ($('#retry').onclick = () => ff24desk.home());
  $('#disc') && ($('#disc').onclick = () => ff24desk.home());
  $('#fold') && ($('#fold').onclick = () => ff24desk.folder());
  $('#bk') && ($('#bk').onclick = () => { series = null; draw(); });
}
$('#m').onclick = async e => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); const d = L.find(x => x.key === del.dataset.del); if (d && confirm('Download löschen?\n\n' + d.title + (d.type === 's' ? ' – ' + d.sub.split(' · ')[0] : ''))) ff24desk.remove(d.key); return; }
  const c = e.target.closest('.card'); if (!c) return;
  if (c.dataset.s) { series = c.dataset.s; draw(); scrollTo(0, 0); return; }
  play(c.dataset.k);
};

// ── Abspielen ───────────────────────────────────────────────
const v = $('#v'); let cur = null, idle;
async function play(k) {
  const d = await ff24desk.play(k); if (!d) return;
  cur = d;
  $('#pt').textContent = d.title; $('#ps').textContent = d.type === 's' ? d.sub : '';
  v.innerHTML = d.vtt ? '<track kind="subtitles" srclang="de" label="Deutsch (Forced)" default src="' + esc(d.vtt) + '">' : '';
  v.src = d.src;
  const pos = Number(localStorage.getItem('ffdl_' + k) || 0);
  v.onloadedmetadata = () => { if (pos > 5 && pos < v.duration - 30) v.currentTime = pos; if (v.textTracks[0]) v.textTracks[0].mode = 'showing'; };
  $('#pl').classList.add('on'); v.play().catch(() => {});
  document.documentElement.requestFullscreen?.().catch(() => {});
}
function closePl() { v.pause(); v.removeAttribute('src'); v.load(); $('#pl').classList.remove('on'); cur = null; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
$('#x').onclick = closePl;
addEventListener('keydown', e => { if (e.key === 'Escape' && cur && !document.fullscreenElement) closePl(); if (e.key === ' ' && cur) { e.preventDefault(); v.paused ? v.play() : v.pause(); } });
v.ontimeupdate = () => {
  if (!cur) return;
  const t = v.currentTime;
  if (Math.floor(t) % 5 === 0) try { localStorage.setItem('ffdl_' + cur.key, v.duration - t < 60 ? 0 : Math.floor(t)); } catch (_) {}
  const iv = cur.intro; $('#skip').style.display = iv && t >= iv[0] && t < iv[1] - 1 ? 'block' : 'none';
  const nx = cur.next && L.find(x => x.key === cur.next);
  $('#next').style.display = nx && v.duration - t < 25 ? 'block' : 'none';
  if (nx) $('#next').textContent = 'Nächste Folge · ' + nx.sub.split(' · ')[0];
};
$('#skip').onclick = () => { if (cur && cur.intro) v.currentTime = cur.intro[1]; };
$('#next').onclick = () => cur && cur.next && play(cur.next);
v.onended = () => { if (cur && cur.next) play(cur.next); else closePl(); };
$('#pl').onmousemove = () => { $('#pl').classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => $('#pl').classList.add('idle'), 2500); };

ff24desk.onChange(l => { L = l; draw(); });
ff24desk.list().then(l => {
  L = l; draw();
  const k = decodeURIComponent(location.hash.slice(1));
  if (k && L.some(d => d.key === k && d.state === 'done')) play(k);
});
</script>
</body>
</html>
