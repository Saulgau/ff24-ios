<!doctype html><html><head><meta charset="utf-8"></head><body style="font:14px sans-serif;padding:10px;min-width:420px">
<h3 style="margin-top:0">FF24 Click'n'Load</h3>
<p>Click'n'Load-Links gehen an JDownloader auf dem FilmFrei24-Server. Normalerweise ist nichts einzustellen.</p>
<label>Server<br><input id="server" style="width:100%"></label><br><br>
<label>Schlüssel<br><input id="token" type="password" style="width:100%"></label><br><br>
<button id="save">Speichern</button> <button id="test">Verbindung testen</button> <span id="msg"></span>
<h4 style="margin:18px 0 6px">Protokoll (letzte Ereignisse)</h4><pre id="log" style="background:#f3f3f3;padding:8px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap">–</pre><button id="clr">Protokoll leeren</button>
<script src="options.js"></script></body></html>
